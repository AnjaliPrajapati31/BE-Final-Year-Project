[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "earthengine-api>=1.6.0",
    "fastapi>=0.139.0",
    "numpy>=2.2.0",
    "pandas>=3.0.3",
    "pillow>=12.0.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pyproj>=3.7.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "rasterio>=1.4.0",
    "shapely>=2.1.0",
    "torch>=2.7.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = ["httpx>=0.28.0", "pytest>=8.4.0", "pytest-cov>=6.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: isolated deterministic tests",
    "integration: tests requiring PostgreSQL/PostGIS",
    "golden: PILOT_001 known-answer scientific gate",
    "gee_live: tests requiring authenticated Google Earth Engine",
]
